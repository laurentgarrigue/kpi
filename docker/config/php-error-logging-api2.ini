; Logging des erreurs PHP pour le conteneur FrankenPHP (api2).
;
; Équivalent de php-error-logging.ini (Apache), mais SANS error_log vers un fichier :
; sous FrankenPHP, les erreurs partent sur stderr et sont récupérées par le driver
; json-file de Docker, donc consultables via `make api2_logs` / `docker logs kpi_api2`.
; C'est cohérent avec Monolog, déjà configuré sur php://stderr.

error_reporting = E_ALL

; Pas d'affichage dans la réponse HTTP : api2 renvoie du JSON, une erreur PHP
; imprimée dedans casserait le parsing côté app2/app4 (et fuiterait des chemins).
; Symfony/API Platform sérialisent déjà les exceptions proprement.
display_errors = Off
display_startup_errors = Off

; Sans ces deux lignes, une erreur fatale PHP dans le worker n'est loggée NULLE PART :
; l'image FrankenPHP a log_errors=Off et error_log vide par défaut.
log_errors = On
error_log = /dev/stderr
