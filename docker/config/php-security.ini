; Durcissement PHP commun aux conteneurs Apache (kpi_php) et FrankenPHP (api2).
;
; PHP2Shell (CVE-2026-109618 / CVE-2026-109619, 2026-10-21) : RCE non authentifiée
; via des uploads multipart, exploitable avant toute exécution de code applicatif.
; Le correctif est la montée de version (PHP >= 8.4.27) ; ce réglage est une défense
; en profondeur recommandée par l'avis PHP. Aucun code KPI n'utilise la progression
; d'upload par session (PHP_SESSION_UPLOAD_PROGRESS).
session.upload_progress.enabled = Off
