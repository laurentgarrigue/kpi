; Développement uniquement — surcharge opcache-worker.ini (chargé par ordre alphabétique).
; Le code d'api2 est monté en volume et change en permanence : sans validate_timestamps=1,
; les modifications ne seraient jamais prises en compte.
;
; ⚠️ En mode worker, cela ne suffit pas : le kernel Symfony reste en mémoire, donc un
; changement de code ne sera visible qu'après recyclage du worker (max_requests) ou
; `make api2_restart`. C'est le compromis assumé du worker en dev.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
