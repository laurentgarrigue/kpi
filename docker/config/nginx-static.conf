# Single nginx container serving the static Nuxt builds of app2 and app4 (dev).
# Each app directory is mounted whole (/srv/app2, /srv/app4) and the root points at
# .output/public inside it: `nuxt generate` recreates .output, and mounting a parent
# that survives the rebuild means nginx sees the new files without a restart.
#
# app2: Traefik routes Host(app.*) here, Host header kept.
# app4: default server; Traefik routes <domain>/admin2 here after stripping /admin2.
#
# Headers (DOC/specs/PWA_AUTO_UPDATE.md §3, tested by scripts/ci/nginx-static.test.mjs):
#  - every add_header lives at server level: one add_header inside a location would REPLACE
#    them all there (nginx inheritance), which used to drop the security headers everywhere;
#  - cache policy by path, from the map below. index.html and the service worker files are
#    always revalidated, otherwise a new build is not picked up; assets are immutable.
#    No `expires`: it would emit a second Cache-Control.

map $uri $kpi_static_cache_control {
    ~*(^|/)(sw\.js|registerSW\.js|manifest\.webmanifest)$  "no-cache, must-revalidate";
    ~*(^|/)workbox-[^/]*\.js$                               "no-cache, must-revalidate";
    # Development: assets cached 1 hour, HTML never stored.
    ~*\.(js|css|jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|eot)$  "public, max-age=3600";
    default                                                 "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
}

server {
    listen 80;
    server_name ~^app\.;

    root /srv/app2/.output/public;
    index index.html;

    # Charset UTF-8
    charset utf-8;

    # Disable sendfile for Docker volumes (development)
    # This prevents file caching issues when files are updated on mounted volumes
    sendfile off;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main location - serve static files from Nuxt build
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (cache policy: map above)
    location ~* \.(js|css|jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        # No try_files fallback: a missing chunk must answer 404, not index.html (PWA_AUTO_UPDATE.md §3).
    }

    # Cache policy (map above): not `always`, an error must not be cached for a year.
    add_header Cache-Control $kpi_static_cache_control;

    # Security headers, on every response (including 403/404)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

server {
    listen 80 default_server;
    server_name _;

    root /srv/app4/.output/public;
    index index.html;

    # Charset UTF-8
    charset utf-8;

    # Disable sendfile for Docker volumes (development)
    sendfile off;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main location - serve static files from Nuxt build.
    # Nuxt is built with baseURL=/admin2; Traefik strips /admin2 before forwarding here.
    # `$uri/index.html` (not `$uri/`): a directory match would make nginx 301 to `/<dir>/`,
    # dropping the stripped /admin2 prefix (same as nginx-static-prod.conf).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Static assets (cache policy: map above)
    location ~* \.(js|css|jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        # No try_files fallback: a missing chunk must answer 404, not index.html (PWA_AUTO_UPDATE.md §3).
    }

    # Cache policy (map above): not `always`, an error must not be cached for a year.
    add_header Cache-Control $kpi_static_cache_control;

    # Security headers, on every response (including 403/404)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
