# Single nginx container serving the static Nuxt builds of app2 and app4 (prod).
# Each app directory is mounted whole (/srv/app2, /srv/app4) and the root points at
# .output/public inside it: `nuxt generate` recreates .output, and mounting a parent
# that survives the rebuild means nginx sees the new files without a restart.
#
# app2: Traefik routes Host(app.*) here, Host header kept.
# app4: default server; Traefik routes <domain>/admin2 here after stripping /admin2.

server {
    listen 80;
    server_name ~^app\.;

    root /srv/app2/.output/public;
    index index.html;

    # Charset UTF-8
    charset utf-8;

    # Enable sendfile for production (better performance)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main location - serve static files from Nuxt build
    location / {
        try_files $uri $uri/ /index.html;

        # Cache HTML files for 5 minutes in production
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Aggressive cache for static assets in production
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

server {
    listen 80 default_server;
    server_name _;

    root /srv/app4/.output/public;
    index index.html;

    # Charset UTF-8
    charset utf-8;

    # Enable sendfile for production (better performance)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Main location - serve static files from Nuxt build
    # Nuxt is built with baseURL=/admin2
    # Traefik strips /admin2 prefix before forwarding here
    # so Nginx receives /competitions, /_nuxt/..., etc.
    location / {
        try_files $uri $uri/index.html /index.html;

        # Cache HTML files for 5 minutes in production
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # Aggressive cache for static assets in production
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
