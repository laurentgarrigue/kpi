name: '${APPLICATION_NAME}'
services:
    kpi:
        container_name: ${PHP_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.dev.web
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_PHP: ${BASE_IMAGE_PHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        ports:
            - 80${DOCKER_SUFFIXE_PORT}:80
        volumes:
            - ../sources:/var/www/html
            - ../DOC:/var/www/html/DOC
            - ${HOST_WORDPRESS_PATH}:/var/www/html/wordpress
            - ./MyParams.php:/var/www/html/commun/MyParams.php
            - ./MyConfig.php:/var/www/html/commun/MyConfig.php
            - ./config/opcache-dev.ini:/usr/local/etc/php/conf.d/opcache-dev.ini
            - ./config/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
            - ${HOST_APACHE2_LOG_PATH}:/var/log/apache2/
        networks:
            - network_kpi
            - traefiknetwork
        depends_on:
            - db
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            # Les exclusions !PathPrefix sont VOLONTAIRES : sans elles, ce routeur (Host seul)
            # récupère /api2 et /admin2 dès que leur conteneur disparaît, et Apache répond un
            # 404 trompeur au lieu d'une erreur franche. cf. §8quater de FRANKENPHP_MIGRATION_ANALYSIS.md
            - "traefik.http.routers.kpi.rule=Host(`${KPI_DOMAIN_NAME}`) && !PathPrefix(`/api2`) && !PathPrefix(`/admin2`)"
            - "traefik.http.routers.kpi.entrypoints=websecure"
            - "traefik.http.routers.kpi.tls=true"
            # Configure Traefik to trust X-Forwarded-* headers and preserve real client IP
            - "traefik.http.services.kpi.loadbalancer.passhostheader=true"
    # API2 - Symfony sous FrankenPHP (mode worker) + hub Mercure natif
    # cf. DOC/developer/audits/FRANKENPHP_MIGRATION_ANALYSIS.md
    api2:
        container_name: ${APPLICATION_NAME}_api2
        build:
            context: ./config
            dockerfile: Dockerfile.api2
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_FRANKENPHP: ${BASE_IMAGE_FRANKENPHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
            - APP_ENV=dev
            # Mode worker : exige runtime/frankenphp-symfony dans composer.json
            - APP_RUNTIME=Runtime\FrankenPhpSymfony\Runtime
            - FRANKENPHP_NUM_WORKERS=2
            - FRANKENPHP_MAX_REQUESTS=500
            # Hub Mercure (dev : abonnements anonymes autorisés)
            - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_SECRET}
            - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_SECRET}
            - MERCURE_CORS_ORIGINS=*
            - MERCURE_ANONYMOUS=1
            # Côté Symfony (symfony/mercure-bundle) : publication des updates.
            # Même secret que le hub ci-dessus, sinon les JWT publisher sont rejetés.
            - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET}
            # Publication en direct dans le conteneur : on court-circuite Traefik
            # (et son certificat auto-signé en dev).
            - MERCURE_URL=http://localhost/.well-known/mercure
            # URL d'abonnement renvoyée au navigateur : via Traefik, préfixe /api2 compris.
            - MERCURE_PUBLIC_URL=https://${KPI_DOMAIN_NAME}/api2/.well-known/mercure
        volumes:
            - ../sources/api2:/app
            # ⚠️ REQUIS : live_document_root='/var/www/html' → sources/live/cache/
            # partagé avec Apache et event-cache-worker (EventCacheService,
            # AdminTvController). Seul montage legacy nécessaire : api2 n'utilise
            # ni MyParams.php, ni MyConfig.php, ni DOC/.
            - ../sources:/var/www/html
            # Historique du hub Mercure (transport bolt, cf. Caddyfile.api2).
            # Persiste les updates pour que les abonnés rattrapent ce qu'ils ont
            # manqué après une coupure réseau. ⚠️ Le fichier survit à un restart,
            # mais PAS le point de reprise : après `make api2_restart`, plus aucun
            # rattrapage (mesuré, cf. §7.7ter) → resync applicative obligatoire.
            # Bind mount plutôt que volume nommé : le projet n'utilise que des
            # bind mounts, et ça garde le .db inspectable.
            - ./mercure_data:/data
            - ./config/opcache-api2-dev.ini:/usr/local/etc/php/conf.d/opcache-api2-dev.ini
        networks:
            - network_kpi
            - traefiknetwork
        depends_on:
            - db
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.api2.rule=Host(`${KPI_DOMAIN_NAME}`) && PathPrefix(`/api2`)"
            - "traefik.http.routers.api2.entrypoints=websecure"
            - "traefik.http.routers.api2.tls=true"
            # Priorité > routeur kpi (Host seul), sinon Apache capterait /api2.
            - "traefik.http.routers.api2.priority=100"
            # Symfony est monté sur /app/public et route depuis la racine.
            - "traefik.http.routers.api2.middlewares=api2-stripprefix"
            - "traefik.http.middlewares.api2-stripprefix.stripprefix.prefixes=/api2"
            - "traefik.http.services.api2.loadbalancer.server.port=80"
    event-cache-worker:
        container_name: ${APPLICATION_NAME}_event_cache_worker
        build:
            context: ./config
            dockerfile: Dockerfile.dev.web
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_PHP: ${BASE_IMAGE_PHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        command: php /var/www/html/api2/bin/console app:event-cache-worker
        volumes:
            - ../sources:/var/www/html
            - ./MyParams.php:/var/www/html/commun/MyParams.php
            - ./MyConfig.php:/var/www/html/commun/MyConfig.php
        networks:
            - network_kpi
        depends_on:
            - db
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
    db:
        container_name: ${DB_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.db
            args:
                BASE_IMAGE_DB: ${BASE_IMAGE_DB}
        command: mariadbd --sql_mode=""
        volumes:
            - ${HOST_DB_PATH}:/var/lib/mysql/
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            TZ: Europe/Paris
            LANG: fr_FR.UTF-8
            LANGUAGE: fr_FR:fr
            LC_ALL: fr_FR.UTF-8
        networks:
            - network_kpi
            - pma_network
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
    dbwp:
        container_name: ${DBWP_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.db
            args:
                BASE_IMAGE_DB: ${BASE_IMAGE_DB}
        volumes:
            - ${HOST_DBWP_PATH}:/var/lib/mysql/
        environment:
            MYSQL_ROOT_PASSWORD: ${DBWP_ROOT_PASSWORD}
            MYSQL_USER: ${DBWP_USER}
            MYSQL_PASSWORD: ${DBWP_PASSWORD}
            MYSQL_DATABASE: ${DBWP_NAME}
            TZ: Europe/Paris
            LANG: fr_FR.UTF-8
            LANGUAGE: fr_FR:fr
            LC_ALL: fr_FR.UTF-8
        # ports:
        #     - 33${DOCKER_SUFFIXE_PORT}:3306
        networks:
            - network_kpi
            - pma_network
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
    node_app2:
        container_name: kpi_node_app2
        build:
            context: ../sources/app2
            dockerfile: ../../docker/node/Dockerfile # Crée ce Dockerfile si besoin
        working_dir: /app
        user: "${USER_ID}:${GROUP_ID}"
        # Démarre le serveur Nuxt avec le conteneur : `make docker_dev_up` suffit,
        # plus besoin d'un terminal dédié pour `make app2_dev`.
        # Logs : `make app2_logs`. Le mode terminal reste dispo via `make app2_dev`.
        command: sh -c "npm run dev"
        volumes:
            - ../sources/app2:/app
        environment:
            - HOST=0.0.0.0
            - PORT=3000
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        networks:
            - network_kpi
            - traefiknetwork
        ports:
            - "3002:3000"
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.app2.rule=Host(`${NODE_DOMAIN_NAME}`)"
            - "traefik.http.routers.app2.entrypoints=websecure"
            - "traefik.http.routers.app2.tls=true"
            - "traefik.http.services.app2.loadbalancer.server.port=3000"

    node_app3:
        container_name: kpi_node_app3
        build:
            context: ../sources/app3
            dockerfile: ../../docker/node/Dockerfile
        working_dir: /app
        user: "${USER_ID}:${GROUP_ID}"
        # ⚠️ Pas de démarrage automatique (contrairement à node_app2 / node_app4) :
        # `npm run dev` échoue sur "dotenv: not found" — dotenv-cli manque dans les
        # node_modules d'app3. Problème préexistant, indépendant de FrankenPHP.
        # Pour lancer app3 : `make app3_npm_install` puis `make app3_dev_terminal`.
        command: ["tail", "-f", "/dev/null"]
        volumes:
            - ../sources/app3:/app
        environment:
            - HOST=0.0.0.0
            - PORT=3003
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        networks:
            - network_kpi
            - traefiknetwork
        ports:
            - "3003:3003"
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.app3.rule=Host(`${APP3_DOMAIN_NAME}`)"
            - "traefik.http.routers.app3.entrypoints=websecure"
            - "traefik.http.routers.app3.tls=true"
            - "traefik.http.services.app3.loadbalancer.server.port=3003"

    node_wsm:
        container_name: kpi_node_wsm
        build:
            context: ../sources/app_wsm_dev
            dockerfile: ../../docker/node/Dockerfile
        working_dir: /app
        user: "${USER_ID}:${GROUP_ID}"
        volumes:
            - ../sources/app_wsm_dev:/app
        environment:
            - HOST=0.0.0.0
            - PORT=8080
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        networks:
            - network_kpi
            - traefiknetwork
        ports:
            - "8080:8080"
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.wsm.rule=Host(`${WSM_DOMAIN_NAME}`)"
            - "traefik.http.routers.wsm.entrypoints=websecure"
            - "traefik.http.routers.wsm.tls=true"
            - "traefik.http.services.wsm.loadbalancer.server.port=8080"

    nginx_app2:
        container_name: ${APPLICATION_NAME}_nginx_app2
        image: nginx:alpine
        volumes:
            - ../sources/app2/.output/public:/usr/share/nginx/html:ro
            - ./config/nginx-app2.conf:/etc/nginx/conf.d/default.conf:ro
            - ${HOST_NGINX_LOG_PATH}:/var/log/nginx/
        environment:
            - TZ=Europe/Paris
        networks:
            - network_kpi
            - traefiknetwork
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.nginx_app2.rule=Host(`app.${KPI_DOMAIN_NAME}`)"
            - "traefik.http.routers.nginx_app2.entrypoints=websecure"
            - "traefik.http.routers.nginx_app2.tls=true"
            - "traefik.http.services.nginx_app2.loadbalancer.server.port=80"

    # App4 - Admin application (Nuxt)
    node_app4:
        container_name: kpi_node_app4
        build:
            context: ../sources/app4
            dockerfile: ../../docker/node/Dockerfile
        working_dir: /app
        user: "${USER_ID}:${GROUP_ID}"
        # Démarre le serveur Nuxt avec le conteneur (cf. node_app2). Logs : `make app4_logs`.
        command: sh -c "npm run dev"
        volumes:
            - ../sources/app4:/app
        environment:
            - HOST=0.0.0.0
            - PORT=3004
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        networks:
            - network_kpi
            - traefiknetwork
        ports:
            - "3004:3004"
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.app4.rule=Host(`${NODE4_DOMAIN_NAME}`)"
            - "traefik.http.routers.app4.entrypoints=websecure"
            - "traefik.http.routers.app4.tls=true"
            - "traefik.http.services.app4.loadbalancer.server.port=3004"

    # Nginx for app4 static files - serves /admin2/ path
    nginx_app4:
        container_name: ${APPLICATION_NAME}_nginx_app4
        image: nginx:alpine
        volumes:
            - ../sources/app4/.output/public:/usr/share/nginx/html:ro
            - ./config/nginx-app4.conf:/etc/nginx/conf.d/default.conf:ro
            - ${HOST_NGINX_LOG_PATH}:/var/log/nginx/
        environment:
            - TZ=Europe/Paris
        networks:
            - network_kpi
            - traefiknetwork
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            # Route /admin2/* to this nginx container
            - "traefik.http.routers.nginx_app4.rule=Host(`${KPI_DOMAIN_NAME}`) && PathPrefix(`/admin2`)"
            - "traefik.http.routers.nginx_app4.entrypoints=websecure"
            - "traefik.http.routers.nginx_app4.tls=true"
            # Strip the /admin2 prefix before forwarding to nginx
            - "traefik.http.routers.nginx_app4.middlewares=strip-admin2"
            - "traefik.http.middlewares.strip-admin2.stripprefix.prefixes=/admin2"
            - "traefik.http.services.nginx_app4.loadbalancer.server.port=80"
            # Higher priority than the main kpi router
            - "traefik.http.routers.nginx_app4.priority=100"


networks:
    network_kpi:
        name: network_${APPLICATION_NAME}
        external: true
    pma_network:
        name: pma_network
        external: true
    traefiknetwork:
        name: traefiknetwork
        external: true

# ci-touch-all: no-op pour éprouver lint-docker + trivy-config (PR jetable, ne pas merger)
