name: '${APPLICATION_NAME}'
services:
    kpi_preprod:
        container_name: ${PHP_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.dev.web
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_PHP: ${BASE_IMAGE_PHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - SMTP_HOST=host.docker.internal
            - SMTP_PORT=25
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ../sources:/var/www/html
            - ../DOC:/var/www/html/DOC
            - ${HOST_WORDPRESS_PATH}:/var/www/html/wordpress
            - ./config/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
            - ${HOST_APACHE2_LOG_PATH}:/var/log/apache2/
            - /etc/msmtprc:/etc/msmtprc:ro
            - /var/log/msmtp:/var/log/msmtp
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - network_kpi
            - traefiknetwork
        depends_on:
            - db_preprod
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            # Les exclusions !PathPrefix sont VOLONTAIRES : sans elles, ce routeur (Host seul)
            # récupère /api2 et /admin2 dès que leur conteneur disparaît, et Apache répond un
            # 404 trompeur au lieu d'une erreur franche. cf. §8quater de FRANKENPHP_MIGRATION_ANALYSIS.md
            - "traefik.http.routers.kpipreprod.rule=Host(`${KPI_DOMAIN_NAME}`) && !PathPrefix(`/api2`) && !PathPrefix(`/admin2`)"
            - "traefik.http.routers.kpipreprod.entrypoints=websecure"
            - "traefik.http.routers.kpipreprod.tls=true"
            - "traefik.http.routers.kpipreprod.tls.certresolver=myresolver"
    # API2 - Symfony sous FrankenPHP (mode worker) + hub Mercure natif
    # cf. DOC/developer/audits/FRANKENPHP_MIGRATION_ANALYSIS.md
    api2_preprod:
        container_name: ${APPLICATION_NAME}_api2
        build:
            context: ./config
            dockerfile: Dockerfile.api2
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_FRANKENPHP: ${BASE_IMAGE_FRANKENPHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
            - APP_ENV=prod
            - APP_DEBUG=0
            # Mode worker : exige runtime/frankenphp-symfony dans composer.json
            - APP_RUNTIME=Runtime\FrankenPhpSymfony\Runtime
            - FRANKENPHP_NUM_WORKERS=4
            - FRANKENPHP_MAX_REQUESTS=500
            # Pas de rechargement à chaud hors dev : code figé.
            - FRANKENPHP_WATCH=
            # Hub Mercure (préprod : abonnements authentifiés uniquement)
            - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_SECRET}
            - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_SECRET}
            - MERCURE_CORS_ORIGINS=https://${KPI_DOMAIN_NAME}
            - MERCURE_ANONYMOUS=0
        volumes:
            - ../sources/api2:/app
            # ⚠️ REQUIS : live_document_root='/var/www/html' → sources/live/cache/
            # partagé avec Apache et event-cache-worker (cf. §7.7 de l'analyse).
            - ../sources:/var/www/html
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - network_kpi
            - traefiknetwork
        depends_on:
            - db_preprod
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.api2preprod.rule=Host(`${KPI_DOMAIN_NAME}`) && PathPrefix(`/api2`)"
            - "traefik.http.routers.api2preprod.entrypoints=websecure"
            - "traefik.http.routers.api2preprod.tls=true"
            - "traefik.http.routers.api2preprod.tls.certresolver=myresolver"
            # Priorité > routeur kpipreprod (Host seul), sinon Apache capterait /api2.
            - "traefik.http.routers.api2preprod.priority=100"
            - "traefik.http.routers.api2preprod.middlewares=api2preprod-stripprefix"
            - "traefik.http.middlewares.api2preprod-stripprefix.stripprefix.prefixes=/api2"
            - "traefik.http.services.api2preprod.loadbalancer.server.port=80"
    event-cache-worker:
        container_name: ${APPLICATION_NAME}_event_cache_worker
        build:
            context: ./config
            dockerfile: Dockerfile.dev.web
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_PHP: ${BASE_IMAGE_PHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        command: php /var/www/html/api2/bin/console app:event-cache-worker
        volumes:
            - ../sources:/var/www/html
        networks:
            - network_kpi
        depends_on:
            - db_preprod
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
    db_preprod:
        container_name: ${DB_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.db
            args:
                BASE_IMAGE_DB: ${BASE_IMAGE_DB}
        command: mariadbd --sql_mode=""
        volumes:
            - ${HOST_DB_PATH}:/var/lib/mysql/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            TZ: Europe/Paris
            LANG: fr_FR.UTF-8
            LANGUAGE: fr_FR:fr
            LC_ALL: fr_FR.UTF-8
        networks:
            - network_kpi
            - pma_network
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
    dbwp_preprod:
        container_name: ${DBWP_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.db
            args:
                BASE_IMAGE_DB: ${BASE_IMAGE_DB}
        volumes:
            - ${HOST_DBWP_PATH}:/var/lib/mysql/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            MYSQL_ROOT_PASSWORD: ${DBWP_ROOT_PASSWORD}
            MYSQL_USER: ${DBWP_USER}
            MYSQL_PASSWORD: ${DBWP_PASSWORD}
            MYSQL_DATABASE: ${DBWP_NAME}
            TZ: Europe/Paris
            LANG: fr_FR.UTF-8
            LANGUAGE: fr_FR:fr
            LC_ALL: fr_FR.UTF-8
        networks:
            - network_kpi
            - pma_network
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped

    nginx_app2:
        container_name: ${APPLICATION_NAME}_nginx_app2
        image: nginx:alpine
        volumes:
            - ../sources/app2/.output/public:/usr/share/nginx/html:ro
            - ./config/nginx-app2-prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ${HOST_NGINX_LOG_PATH}:/var/log/nginx/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            - TZ=Europe/Paris
        networks:
            - network_kpi
            - traefiknetwork
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.nginx_app2_preprod.rule=Host(`app.${KPI_DOMAIN_NAME}`)"
            - "traefik.http.routers.nginx_app2_preprod.entrypoints=websecure"
            - "traefik.http.routers.nginx_app2_preprod.tls=true"
            - "traefik.http.routers.nginx_app2_preprod.tls.certresolver=myresolver"
            - "traefik.http.services.nginx_app2_preprod.loadbalancer.server.port=80"

    nginx_app4:
        container_name: ${APPLICATION_NAME}_nginx_app4
        image: nginx:alpine
        volumes:
            - ../sources/app4/.output/public:/usr/share/nginx/html:ro
            - ./config/nginx-app4-prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ${HOST_NGINX_LOG_PATH}:/var/log/nginx/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            - TZ=Europe/Paris
        networks:
            - network_kpi
            - traefiknetwork
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            # Route /admin2/* to this nginx container
            - "traefik.http.routers.nginx_app4_preprod.rule=Host(`${KPI_DOMAIN_NAME}`) && PathPrefix(`/admin2`)"
            - "traefik.http.routers.nginx_app4_preprod.entrypoints=websecure"
            - "traefik.http.routers.nginx_app4_preprod.tls=true"
            - "traefik.http.routers.nginx_app4_preprod.tls.certresolver=myresolver"
            # Strip the /admin2 prefix before forwarding to nginx
            - "traefik.http.routers.nginx_app4_preprod.middlewares=strip-admin2_preprod"
            - "traefik.http.middlewares.strip-admin2_preprod.stripprefix.prefixes=/admin2"
            - "traefik.http.services.nginx_app4_preprod.loadbalancer.server.port=80"
            # Higher priority than the main kpi router
            - "traefik.http.routers.nginx_app4_preprod.priority=100"

networks:
    network_kpi:
        external: true
        name: network_${APPLICATION_NAME}
    pma_network:
        name: pma_network
        external: true
    traefiknetwork:
        name: traefiknetwork
        external: true
