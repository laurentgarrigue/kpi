name: '${APPLICATION_NAME}'
services:
    kpi:
        container_name: ${PHP_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.prod.web
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_PHP: ${BASE_IMAGE_PHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - SMTP_HOST=host.docker.internal
            - SMTP_PORT=25
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ../sources:/var/www/html
            - ../DOC:/var/www/html/DOC
            - ${HOST_WORDPRESS_PATH}:/var/www/html/wordpress
            - ${HOST_APACHE2_LOG_PATH}:/var/log/apache2/
            - /etc/msmtprc:/etc/msmtprc:ro
            - /var/log/msmtp:/var/log/msmtp
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - network_kpi
            - traefiknetwork
        depends_on:
            - db
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            # Les exclusions !PathPrefix sont VOLONTAIRES : sans elles, ce routeur (Host seul)
            # récupère /api2 et /admin2 dès que leur conteneur disparaît, et Apache répond un
            # 404 trompeur au lieu d'une erreur franche. cf. §8quater de FRANKENPHP_MIGRATION_ANALYSIS.md
            # Les parenthèses autour du || sont OBLIGATOIRES (précédence des opérateurs).
            - "traefik.http.routers.kpi.rule=(Host(`${KPI_DOMAIN_NAME}`) || Host(`www.${KPI_DOMAIN_NAME}`)) && !PathPrefix(`/api2`) && !PathPrefix(`/admin2`)"
            - "traefik.http.routers.kpi.entrypoints=websecure"
            - "traefik.http.routers.kpi.tls=true"
            - "traefik.http.routers.kpi.tls.certresolver=myresolver"
    # API2 - Symfony sous FrankenPHP (mode worker) + hub Mercure natif
    # cf. DOC/developer/audits/FRANKENPHP_MIGRATION_ANALYSIS.md
    api2:
        container_name: ${APPLICATION_NAME}_api2
        build:
            context: ./config
            dockerfile: Dockerfile.api2
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_FRANKENPHP: ${BASE_IMAGE_FRANKENPHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
            - APP_ENV=prod
            - APP_DEBUG=0
            # Mode worker : exige runtime/frankenphp-symfony dans composer.json
            - APP_RUNTIME=Runtime\FrankenPhpSymfony\Runtime
            - FRANKENPHP_NUM_WORKERS=4
            - FRANKENPHP_MAX_REQUESTS=500
            # Pas de rechargement à chaud en prod : code figé.
            # ⚠️ NE PAS mettre une valeur vide : elle n'éteint PAS le watcher, elle
            # le rend PLUS large (FrankenPHP applique alors son défaut interne
            # `./**/*.{env,php,twig,yaml,yml}`, qui surveille tout /app, var/cache/
            # compris → redémarrages du worker à chaque cache:clear).
            # /watch-disabled est un dossier vide créé dans l'image (Dockerfile.api2) :
            # le watcher démarre proprement et n'a rien à surveiller. Un chemin
            # inexistant, lui, ferait boucler le watcher. Mesuré le 2026-07-17.
            - FRANKENPHP_WATCH=/watch-disabled
            # Hub Mercure (prod : abonnements authentifiés uniquement)
            - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_SECRET}
            - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_SECRET}
            - MERCURE_CORS_ORIGINS=https://${KPI_DOMAIN_NAME}
            - MERCURE_ANONYMOUS=0
        volumes:
            - ../sources/api2:/app
            # ⚠️ REQUIS : live_document_root='/var/www/html' → sources/live/cache/
            # partagé avec Apache et event-cache-worker (cf. §7.7 de l'analyse).
            - ../sources:/var/www/html
            # Historique du hub Mercure (transport bolt, cf. Caddyfile.api2).
            # Persiste les updates pour que les abonnés rattrapent ce qu'ils ont
            # manqué après une coupure réseau. ⚠️ Le fichier survit à un restart,
            # mais PAS le point de reprise : après `make api2_restart`, plus aucun
            # rattrapage (mesuré, cf. §7.7ter) → resync applicative obligatoire.
            # ⚠️ Chemin propre à CETTE instance : préprod et prod tournant sur le
            # même VPS, un chemin partagé ferait écrire deux hubs dans le même
            # fichier bolt (verrou exclusif → l'un des deux ne démarre pas).
            - ./mercure_data:/data
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - network_kpi
            - traefiknetwork
        depends_on:
            - db
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.api2.rule=(Host(`${KPI_DOMAIN_NAME}`) || Host(`www.${KPI_DOMAIN_NAME}`)) && PathPrefix(`/api2`)"
            - "traefik.http.routers.api2.entrypoints=websecure"
            - "traefik.http.routers.api2.tls=true"
            - "traefik.http.routers.api2.tls.certresolver=myresolver"
            # Priorité > routeur kpi (Host seul), sinon Apache capterait /api2.
            - "traefik.http.routers.api2.priority=100"
            - "traefik.http.routers.api2.middlewares=api2-stripprefix"
            - "traefik.http.middlewares.api2-stripprefix.stripprefix.prefixes=/api2"
            - "traefik.http.services.api2.loadbalancer.server.port=80"
    event-cache-worker:
        container_name: ${APPLICATION_NAME}_event_cache_worker
        build:
            context: ./config
            dockerfile: Dockerfile.prod.web
            args:
                USER_ID: ${USER_ID}
                GROUP_ID: ${GROUP_ID}
                BASE_IMAGE_PHP: ${BASE_IMAGE_PHP}
        user: ${USER_ID}:${GROUP_ID}
        environment:
            - TZ=Europe/Paris
            - LANG=fr_FR.UTF-8
            - LANGUAGE=fr_FR:fr
            - LC_ALL=fr_FR.UTF-8
        command: php /var/www/html/api2/bin/console app:event-cache-worker
        volumes:
            - ../sources:/var/www/html
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        networks:
            - network_kpi
        depends_on:
            - db
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
    db:
        container_name: ${DB_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.db
            args:
                BASE_IMAGE_DB: ${BASE_IMAGE_DB}
        command: mariadbd --sql_mode=""
        volumes:
            - ${HOST_DB_PATH}:/var/lib/mysql/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            TZ: Europe/Paris
            LANG: fr_FR.UTF-8
            LANGUAGE: fr_FR:fr
            LC_ALL: fr_FR.UTF-8
        networks:
            - network_kpi
            - pma_network
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
    dbwp:
        container_name: ${DBWP_CONTAINER_NAME}
        build:
            context: ./config
            dockerfile: Dockerfile.db
            args:
                BASE_IMAGE_DB: ${BASE_IMAGE_DB}
        volumes:
            - ${HOST_DBWP_PATH}:/var/lib/mysql/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            MYSQL_ROOT_PASSWORD: ${DBWP_ROOT_PASSWORD}
            MYSQL_USER: ${DBWP_USER}
            MYSQL_PASSWORD: ${DBWP_PASSWORD}
            MYSQL_DATABASE: ${DBWP_NAME}
            TZ: Europe/Paris
            LANG: fr_FR.UTF-8
            LANGUAGE: fr_FR:fr
            LC_ALL: fr_FR.UTF-8
        networks:
            - network_kpi
            - pma_network
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped

    nginx_app2:
        container_name: ${APPLICATION_NAME}_nginx_app2
        image: nginx:alpine
        volumes:
            - ../sources/app2/.output/public:/usr/share/nginx/html:ro
            - ./config/nginx-app2-prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ${HOST_NGINX_LOG_PATH}:/var/log/nginx/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            - TZ=Europe/Paris
        networks:
            - network_kpi
            - traefiknetwork
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.nginx_app2.rule=Host(`app.${KPI_DOMAIN_NAME}`)"
            - "traefik.http.routers.nginx_app2.entrypoints=websecure"
            - "traefik.http.routers.nginx_app2.tls=true"
            - "traefik.http.routers.nginx_app2.tls.certresolver=myresolver"
            - "traefik.http.services.nginx_app2.loadbalancer.server.port=80"

    nginx_app4:
        container_name: ${APPLICATION_NAME}_nginx_app4
        image: nginx:alpine
        volumes:
            - ../sources/app4/.output/public:/usr/share/nginx/html:ro
            - ./config/nginx-app4-prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ${HOST_NGINX_LOG_PATH}:/var/log/nginx/
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            - TZ=Europe/Paris
        networks:
            - network_kpi
            - traefiknetwork
        logging:
            driver: "json-file"
            options:
                max-size: 10m
                max-file: 3
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            # Route /admin2/* to this nginx container
            - "traefik.http.routers.nginx_app4.rule=(Host(`${KPI_DOMAIN_NAME}`) || Host(`www.${KPI_DOMAIN_NAME}`)) && PathPrefix(`/admin2`)"
            - "traefik.http.routers.nginx_app4.entrypoints=websecure"
            - "traefik.http.routers.nginx_app4.tls=true"
            - "traefik.http.routers.nginx_app4.tls.certresolver=myresolver"
            # Strip the /admin2 prefix before forwarding to nginx
            - "traefik.http.routers.nginx_app4.middlewares=strip-admin2"
            - "traefik.http.middlewares.strip-admin2.stripprefix.prefixes=/admin2"
            - "traefik.http.services.nginx_app4.loadbalancer.server.port=80"
            # Higher priority than the main kpi router
            - "traefik.http.routers.nginx_app4.priority=100"

networks:
    network_kpi:
        external: true
        name: network_${APPLICATION_NAME}
    pma_network:
        name: pma_network
        external: true
    traefiknetwork:
        name: traefiknetwork
        external: true
