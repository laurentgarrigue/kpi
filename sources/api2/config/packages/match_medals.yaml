# Thresholds of the match medals (DOC/specs/public/FEATURE_MATCH_MEDALS.md § 5.4): the ORIGINAL values.
# Profile 1 can replace them from app4 (Operations > Medals > Seasons, stored in kp_medal_setting); those replacements win.
# Common to every competition. Changing one changes nothing until a season is computed again
# (make api2_match_medals_compute season=…): each season keeps the copy of the thresholds it was computed with.
# Changing a RULE in the code instead: increment match_medals.rules_version.
parameters:
    match_medals.rules_version: 3
    match_medals.thresholds:
        bounceBackSeconds: 30          # Réplique · Bounce Back
        comebackDeficit: 3             # Remontée · Comeback, Retour au score · Fightback
        scoringRunGoals: 3             # Série · Scoring Run
        lateWindowSeconds: 30          # Dernières secondes · Late Winner, Égalisation salvatrice · Lifeline
        fastStartSeconds: 30           # Entrée express · Fast Start
        hatTrickGoals: 3               # Triplé · Hat-trick, Triplé consécutif · Natural Hat-trick
        quadrupleGoals: 4              # Quadruplé · Four-goal Haul, Quadruplé consécutif · Natural Four-goal Haul
        bigWinMargin: 5                # Large victoire · Big Win
        penaltyKillExclusions: 2       # Résistance · Penalty Kill
        marathonOvertimes: 2           # Marathon
        exclusionSeconds: 120          # exclusion of a green, yellow or red card (§ 5.3)
        permanentCards: [D]            # exclusion until the end of the game (red card « définitif », future black card)
        regularPeriodSeconds: 600      # half (§ 5.2)
        extraPeriodSeconds: 300        # overtime
        thrillerLeadChanges: 3         # Suspense · Thriller
        seesawEqualizers: 4            # Chassé-croisé · Seesaw
        goalFestTopPercent: 10         # Festival · Goal Fest
        goalFestMinGames: 10
        chessMatchMaxGoals: 2          # Partie d’échecs · Chess Match
        goalTimingSliceSeconds: 120    # Minutes des buts · Goal Timing
        refereeMinGames: 5             # referee indicators shown from N games officiated
