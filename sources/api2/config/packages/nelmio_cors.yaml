nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        # allow_credentials indispensable pour que les navigateurs envoient le cookie refresh (AUTH_HARDENING § 1b).
        # Nécessite un allow_origin explicite (jamais '*'), déjà respecté via CORS_ALLOW_ORIGIN.
        allow_credentials: true
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Active-Mandate', 'Cache-Control', 'Pragma', 'Expires']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null
