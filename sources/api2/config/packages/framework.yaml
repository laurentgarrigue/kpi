# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Traefik strippe le préfixe /api2 avant FrankenPHP : Symfony ne le voit jamais et
    # génèrerait des URLs d'assets à la racine (/bundles/...), servies par Apache → 404
    # (Swagger sans CSS ni JS). Réglage DISTINCT de DEFAULT_URI, qui ne couvre que le
    # routeur. Vrai dans tous les environnements : l'URL publique est toujours /api2.
    # cf. DOC/developer/audits/FRANKENPHP_MIGRATION_ANALYSIS.md §7.6
    assets:
        base_path: '/api2'

    # Note that the session will be started ONLY if you read or write from it.
    session: true
    # Adresse réelle du visiteur (limite de débit de /search) : api2 est derrière Traefik, et le rendu
    # serveur d'app3 lui transmet l'adresse du visiteur. On ne fait confiance qu'à X-Forwarded-For, et
    # seulement venant du réseau privé (Traefik, app3). Schéma et hôte restent ceux de la requête.
    trusted_proxies: '127.0.0.1,PRIVATE_SUBNETS'
    trusted_headers: ['x-forwarded-for']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
