doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            enum: Doctrine\DBAL\Types\StringType
        mapping_types:
            enum: string
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            #
            # ⚠️ Ce suffixe est un GARDE-FOU, pas un détail : en APP_ENV=test,
            # Doctrine ajoute `_test` au nom de base du DATABASE_URL. Donc
            # `DATABASE_URL=…/kpi` attaque en réalité `kpi_test`, et il est
            # IMPOSSIBLE de faire tourner la suite de tests sur la base de
            # dev/préprod/prod par simple erreur de variable d'environnement.
            # Conséquence pratique (Phase 4) : la base de fixtures doit s'appeler
            # `<nom>_test`, et le DATABASE_URL des tests doit citer `<nom>` SANS
            # le suffixe. Voir SQL/fixtures/README.md.
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
