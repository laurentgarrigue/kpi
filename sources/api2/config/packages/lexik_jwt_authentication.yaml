lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: '%env(int:JWT_TTL)%'

    # Token extraction from request
    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
        query_parameter:
            enabled: false
        cookie:
            enabled: false

# Tests : clé symétrique (HS256) au lieu de la paire RSA de config/jwt/ (absente en CI et dans les bases de test) ;
# les tests d'intégration signent ainsi les JWT des comptes de SQL/fixtures sans fichier de clé.
when@test:
    lexik_jwt_authentication:
        secret_key: 'test-only-jwt-secret-of-at-least-thirty-two-bytes'
        public_key: null
        pass_phrase: ''
        encoder:
            signature_algorithm: HS256
