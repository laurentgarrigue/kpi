# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    live_document_root: '/var/www/html'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Controller\AdminTvController:
        arguments:
            $liveDocumentRoot: '%live_document_root%'

    App\Service\EventCacheService:
        arguments:
            $liveDocumentRoot: '%live_document_root%'

    App\Service\NotificationService:
        arguments:
            $mailFrom: '%env(MAILER_FROM)%'
            $mailAdminTo: '%env(MAILER_ADMIN_TO)%'
            $app4Url: '%env(APP4_URL)%'

    App\Service\PceImportService:
        arguments:
            $ffckPceUrl: '%env(FFCK_PCE_URL)%'
            $ffckPceUser: '%env(FFCK_PCE_USER)%'
            $ffckPcePwd: '%env(FFCK_PCE_PWD)%'

    App\Controller\AdminMercureController:
        arguments:
            $mercurePublicUrl: '%env(default::MERCURE_PUBLIC_URL)%'

    App\Controller\AdminPresenceController:
        arguments:
            $surclassementCompetitions: '%env(csv:SURCLASSEMENT_COMPETITIONS)%'
            $surclassementExemptCategories: '%env(csv:SURCLASSEMENT_EXEMPT_CATEGORIES)%'

    # Replaces Symfony's default role_hierarchy_voter: it reads roles from the security
    # token's cached getRoleNames() (frozen at the first access_control check, before the
    # active mandate is applied), which makes every #[IsGranted(...)] blind to mandates.
    # MandateAwareRoleHierarchyVoter reads straight from the User entity instead. See
    # its docblock and DOC/developer/reference/PROFILE_ROLES.md for the full story.
    security.access.role_hierarchy_voter:
        class: App\Security\MandateAwareRoleHierarchyVoter
        arguments:
            $roleHierarchy: '@security.role_hierarchy'
