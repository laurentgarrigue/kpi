name: Deploy preprod

# Phase 5 du plan CI/CD (DOC/developer/in-progress/plans/CI_CD_STRATEGY.md).
# Déploiement continu de la préprod : tout commit qui atterrit sur `develop` est
# déployé sur le VPS préprod, sans intervention.
#
# Déclencheur : `push` sur `develop`. La garantie « code testé » est STRUCTURELLE :
# `develop` exige une PR à CI verte (ruleset), donc un commit ne peut y arriver que
# validé — inutile de re-jouer la CI (pas de 2e run). Filet final : le smoke test du
# wrapper + rollback auto protègent la préprod même en cas de push exceptionnel.
# On a délibérément abandonné le déclencheur `workflow_run` : il n'écoutait que les CI
# qui se terminent sur develop, or `ci.yml` ne tourne que sur `pull_request` (jamais
# sur push develop) → il ne se déclenchait JAMAIS. Voir le journal d'exécution.
#
# Toute la logique de déploiement vit dans `deploy-wrapper.sh`, versionné dans le
# repo PRIVÉ `vps-manager` (aux côtés de backup.sh / health-check.sh), PAS dans ce
# repo : ça évite d'exposer la topologie du serveur, et rend le déploiement testable
# à la main en SSH. Sur le VPS, `/home/deploy/deploy-wrapper.sh` est un SYMLINK vers
# le fichier du checkout vps-manager (chemin stable côté workflow, indépendant de
# l'emplacement du clone). Ce workflow ne fait que déclencher le wrapper avec le SHA.

on:
  push:
    branches: [main]
    # Un bump de version pur ou une modif de doc ne change AUCUN comportement :
    # les redéployer est du bruit (et, avant la consolidation, ce bruit ouvrait
    # des fenêtres de conflit). `paths-ignore` ne filtre QUE ce déclencheur
    # `push` : le `workflow_dispatch` ci-dessous et le retour automatique du cron
    # `--check-expiry` (qui appelle le wrapper directement sur le VPS) ne sont
    # pas concernés.
    paths-ignore:
      - '**/package.json'
      - '**/composer.json'
      - 'sources/api2/config/packages/nelmio_api_doc.yaml'
      - 'sources/api2/config/packages/api_platform.yaml'
      - 'DOC/**'
      - '**/*.md'
  # Permet un redéploiement manuel de la préprod sur le dernier main.
  workflow_dispatch:

# Least privilege : lecture seule du repo.
permissions:
  # `write` (et non `read`) UNIQUEMENT pour l'étape de revert automatique en fin de
  # fichier : quand un déploiement échoue, le wrapper restaure le VPS mais le commit
  # fautif RESTE sur `main` — sans revert, le déploiement suivant le re-déploierait
  # et re-rollbackerait. L'étape ouvre donc une PR de revert (jamais de push direct :
  # `main` l'interdit, ruleset).
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Un seul déploiement préprod à la fois ; on n'annule pas celui en cours (un
  # déploiement à moitié appliqué est pire qu'un déploiement en retard).
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ← charge les secrets SSH_* + DEPLOY_PATH scopés à la préprod. Un job ne peut
    #   PAS lire les secrets de l'environment `production`.
    environment: preprod
    steps:
      - name: Résoudre le SHA à déployer
        id: sha
        env:
          # push sur develop comme workflow_dispatch : github.sha = le HEAD de develop
          # à déployer, dans les deux cas.
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sha="$COMMIT_SHA"
          # Garde-fou anti-injection : un SHA git est exactement 40 hex.
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::SHA invalide: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Déploiement préprod du SHA $sha"

      # Déploiement via SSH, avec UN retry automatique (voir le bloc « retry » plus
      # bas). Le retry couvre l'aléa réseau connu : le `dial tcp: i/o timeout`
      # transitoire sur l'ÉTABLISSEMENT de la connexion runner↔VPS (échec en ~25-40s,
      # avant même que le wrapper démarre). Un simple re-run manuel le corrigeait
      # jusqu'ici — on l'automatise. C'est SANS risque de demi-déploiement : le
      # wrapper repart de zéro (snapshot + reset --hard + rebuild sélectif + smoke +
      # rollback auto), il est conçu pour être rejoué. `continue-on-error` sur la 1re
      # tentative pour ne PAS échouer le job si elle rate — c'est le retry qui tranche.
      - name: Déployer via SSH (wrapper VPS) — tentative 1
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # `timeout` = délai d'établissement de la connexion SSH (élargi vs le défaut
          # 30s à cause de l'aléa réseau ci-dessus). `command_timeout` couvre toute la
          # durée du wrapper (generate + composer).
          timeout: 60s
          command_timeout: 15m
          script: /home/deploy/deploy-wrapper.sh preprod ${{ steps.sha.outputs.sha }}

      # Ne tourne QUE si la 1re tentative a échoué. Petite pause pour laisser passer
      # l'aléa réseau, puis on rejoue le wrapper à l'identique. Si CETTE tentative
      # échoue à son tour, l'étape (sans continue-on-error) fait échouer le job — on
      # ne masque donc pas un vrai problème (build cassé, smoke KO → rollback…).
      - name: Pause avant retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Déployer via SSH (wrapper VPS) — retry
        if: steps.deploy1.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60s
          command_timeout: 15m
          script: /home/deploy/deploy-wrapper.sh preprod ${{ steps.sha.outputs.sha }}

      # --- Revert automatique quand le déploiement a échoué --------------------
      #
      # POURQUOI. Le wrapper rollback le VPS tout seul (il restaure
      # `.last-deploy-sha`), mais ce rollback est CÔTÉ SERVEUR : le commit fautif
      # reste sur `main`. Sans revert, le prochain push redéploierait exactement le
      # même commit cassé, qui re-rollbackerait — la boucle que ce projet a vécue.
      #
      # Le revert passe par une PR : `main` refuse le push direct (ruleset), et une
      # PR laisse la CI se prononcer sur le revert avant qu'il n'atterrisse.
      #
      # Si le revert CONFLICTE (le commit fautif a été suivi d'autres changements
      # sur les mêmes fichiers), on n'échoue pas en silence : on ouvre une ISSUE
      # avec la marche à suivre manuelle.
      #
      # Ce workflow ne checkoute rien pour déployer (il ne fait que du SSH) : ce
      # checkout-ci est donc nécessaire, avec `fetch-depth: 0` pour que `git revert`
      # dispose de l'historique.
      - name: Checkout pour le revert
        if: failure()
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ouvrir une PR de revert (ou une issue si conflit)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          # Le SHA est déjà validé `^[0-9a-f]{40}$` par l'étape « Résoudre le SHA »,
          # mais on le passe par l'environnement plutôt que de l'interpoler dans le
          # `run:` — règle du projet, sans exception (anti-injection).
          BAD_SHA: ${{ steps.sha.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          short="$(printf '%s' "$BAD_SHA" | cut -c1-8)"
          branch="revert/$short"
          subject="$(git log -1 --pretty=%s "$BAD_SHA")"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Une PR de revert est peut-être déjà ouverte (déploiement rejoué).
          if gh pr list --head "$branch" --base main --state open \
               --json number --jq '.[0].number // empty' | grep -q .; then
            echo "Une PR de revert est déjà ouverte pour $short — rien à faire."
            exit 0
          fi

          git checkout -B "$branch" "origin/main"

          if git revert --no-edit "$BAD_SHA"; then
            git push --force-with-lease origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "revert: déploiement préprod KO sur $short" \
              --body "Le déploiement préprod du commit \`$BAD_SHA\` a échoué et la préprod a été **rollbackée côté VPS**.

          Commit reverté : \`$short\` — $subject
          Run en échec : $RUN_URL

          ⚠️ **Cette PR est nécessaire** : le rollback du wrapper ne touche que le serveur.
          Sans ce revert, le prochain déploiement re-déploierait le commit fautif.

          Vérifie la cause de l'échec dans le run avant de merger — si le problème vient
          d'ailleurs (aléa réseau, VPS), ferme cette PR plutôt que de la merger."
            echo "✅ PR de revert ouverte pour $short."
          else
            git revert --abort || true
            gh issue create \
              --title "⚠️ Revert automatique impossible pour $short (conflit)" \
              --body "Le déploiement préprod de \`$BAD_SHA\` a échoué (préprod rollbackée côté VPS),
          mais le revert automatique **conflicte** — il touche des fichiers modifiés depuis.

          Commit à reverter : \`$short\` — $subject
          Run en échec : $RUN_URL

          Marche à suivre manuelle :
          \`\`\`bash
          make preprod_rollback sha=$BAD_SHA
          # résous les conflits, puis :
          git revert --continue
          make pr_create && make pr_checks && make pr_merge
          \`\`\`"
            echo "::warning::Revert en conflit — une issue a été ouverte pour $short."
          fi
