name: Deploy preprod

# Phase 5 du plan CI/CD (DOC/developer/in-progress/plans/CI_CD_STRATEGY.md).
# Déploiement continu de la préprod : tout commit qui atterrit sur `develop` est
# déployé sur le VPS préprod, sans intervention.
#
# Déclencheur : `push` sur `develop`. La garantie « code testé » est STRUCTURELLE :
# `develop` exige une PR à CI verte (ruleset), donc un commit ne peut y arriver que
# validé — inutile de re-jouer la CI (pas de 2e run). Filet final : le smoke test du
# wrapper + rollback auto protègent la préprod même en cas de push exceptionnel.
# On a délibérément abandonné le déclencheur `workflow_run` : il n'écoutait que les CI
# qui se terminent sur develop, or `ci.yml` ne tourne que sur `pull_request` (jamais
# sur push develop) → il ne se déclenchait JAMAIS. Voir le journal d'exécution.
#
# Toute la logique de déploiement vit dans `deploy-wrapper.sh`, versionné dans le
# repo PRIVÉ `vps-manager` (aux côtés de backup.sh / health-check.sh), PAS dans ce
# repo : ça évite d'exposer la topologie du serveur, et rend le déploiement testable
# à la main en SSH. Sur le VPS, `/home/deploy/deploy-wrapper.sh` est un SYMLINK vers
# le fichier du checkout vps-manager (chemin stable côté workflow, indépendant de
# l'emplacement du clone). Ce workflow ne fait que déclencher le wrapper avec le SHA.

on:
  push:
    branches: [develop]
  # Permet un redéploiement manuel de la préprod sur le dernier develop.
  workflow_dispatch:

# Least privilege : lecture seule du repo.
permissions:
  contents: read

concurrency:
  # Un seul déploiement préprod à la fois ; on n'annule pas celui en cours (un
  # déploiement à moitié appliqué est pire qu'un déploiement en retard).
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ← charge les secrets SSH_* + DEPLOY_PATH scopés à la préprod. Un job ne peut
    #   PAS lire les secrets de l'environment `production`.
    environment: preprod
    steps:
      - name: Résoudre le SHA à déployer
        id: sha
        env:
          # push sur develop comme workflow_dispatch : github.sha = le HEAD de develop
          # à déployer, dans les deux cas.
          COMMIT_SHA: ${{ github.sha }}
        run: |
          sha="$COMMIT_SHA"
          # Garde-fou anti-injection : un SHA git est exactement 40 hex.
          if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::SHA invalide: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Déploiement préprod du SHA $sha"

      - name: Déployer via SSH (wrapper VPS)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # `timeout` = délai d'établissement de la connexion SSH. Le défaut (30s)
          # produisait des `dial tcp: i/o timeout` transitoires (réseau runner↔VPS
          # intermittent) alors que le déploiement suivant repassait. On l'élargit.
          # `command_timeout` couvre toute la durée du wrapper (generate + composer).
          timeout: 60s
          command_timeout: 15m
          script: /home/deploy/deploy-wrapper.sh preprod ${{ steps.sha.outputs.sha }}
