# Dependabot configuration
#
# Les mises à jour ciblent la branche par défaut (`main`), seule branche longue
# durée depuis la consolidation du 2026-09-13 (voir
# DOC/developer/archive/ci-cd/GIT_WORKFLOW_SIMPLIFICATION.md).
#
# `target-branch: "develop"` a été RETIRÉ : il n'y a plus de branche `develop`.
# Accessoirement, cela règle la limitation GitHub qui faisait ouvrir les
# *security updates* sur `main` en ignorant `target-branch` — la divergence
# structurelle qu'elle provoquait n'a plus d'objet.
#
# Les updates sont groupées par répertoire/écosystème : un seul PR (et donc un
# seul recalcul de lockfile) au lieu d'un PR par paquet -> moins de conflits.

version: 2
updates:
  # ---- npm ----
  - package-ecosystem: "npm"
    directories:
      - "/sources/app2"
      - "/sources/app3"
      - "/sources/app4"
      - "/sources"
      # `/sources/app_dev`, `/sources/app_live_dev`, `/sources/app_wsm_dev` sont
      # volontairement ABSENTS : ces
      # applications Vue.js legacy ne sont ni buildées, ni testées, ni déployées
      # par le CI/CD. Aucun job de `ci.yml` ne les couvre (matrices `[app2, app4]`),
      # donc leurs PR de bump ne peuvent pas être validées — elles n'apportaient
      # que du bruit et des lockfiles à arbitrer à la main.
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns:
          - "*"

  # ---- composer ----
  - package-ecosystem: "composer"
    directories:
      - "/sources/api2"
      - "/sources"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      composer-all:
        patterns:
          - "*"

  # ---- Images Docker (FROM des Dockerfiles) ----
  # Les versions sont épinglées dans les Dockerfiles (et non dans docker/.env, non
  # versionné) précisément pour que Dependabot puisse les proposer en PR.
  # PAS de groupe : une PR par image, car leurs risques diffèrent — en particulier
  # mariadb (Dockerfile.db), dont un bump migre les fichiers de données et exige
  # dump + validation préprod avant merge (cf. en-tête de Dockerfile.db).
  - package-ecosystem: "docker"
    directories:
      - "/docker/config"
      - "/docker/node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # ---- Images Docker des compose (image: nginx, node) ----
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # ---- GitHub Actions (au cas où des workflows seraient ajoutés) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
