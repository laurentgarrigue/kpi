# Dependabot configuration
#
# Les mises à jour ciblent la branche par défaut (`main`), seule branche longue
# durée depuis la consolidation du 2026-09-13 (voir
# DOC/developer/guides/GIT_WORKFLOW_SIMPLIFICATION.md).
#
# `target-branch: "develop"` a été RETIRÉ : il n'y a plus de branche `develop`.
# Accessoirement, cela règle la limitation GitHub qui faisait ouvrir les
# *security updates* sur `main` en ignorant `target-branch` — la divergence
# structurelle qu'elle provoquait n'a plus d'objet.
#
# Les updates sont groupées par répertoire/écosystème : un seul PR (et donc un
# seul recalcul de lockfile) au lieu d'un PR par paquet -> moins de conflits.
#
# `/sources/app3` est volontairement ABSENT : la feuille de marque n'est plus
# buildée/testée/déployée (retirée du CI/CD) — elle ne subsiste que comme
# RÉFÉRENCE pour la construction du scoring dans app4 (DOC/specs/PAGE_SCORING.md).
# La suivre ne produirait que des PR de bump sur du code qui ne tourne nulle part.
# Voir §6 de DOC/developer/reference/LIVE_MATCH_SCORING_REFACTORING_PROPOSALS.md.

version: 2
updates:
  # ---- npm ----
  - package-ecosystem: "npm"
    directories:
      - "/sources/app2"
      - "/sources/app4"
      - "/sources"
      # `/sources/app_dev`, `/sources/app_live_dev`, `/sources/app_wsm_dev` sont
      # volontairement ABSENTS, pour la même raison qu'app3 (cf. en-tête) : ces
      # applications Vue.js legacy ne sont ni buildées, ni testées, ni déployées
      # par le CI/CD. Aucun job de `ci.yml` ne les couvre (matrices `[app2, app4]`),
      # donc leurs PR de bump ne peuvent pas être validées — elles n'apportaient
      # que du bruit et des lockfiles à arbitrer à la main.
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns:
          - "*"

  # ---- composer ----
  - package-ecosystem: "composer"
    directories:
      - "/sources/api2"
      - "/sources"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      composer-all:
        patterns:
          - "*"

  # ---- GitHub Actions (au cas où des workflows seraient ajoutés) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
