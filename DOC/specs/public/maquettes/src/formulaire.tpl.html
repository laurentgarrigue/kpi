<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription</title>
<link rel="stylesheet" href="maquette.css">
<style>
.layout { display: grid; grid-template-columns: minmax(0, 680px) 300px; gap: 48px; justify-content: center; padding-bottom: 56px; }
.layout h1 { font-size: 46px; line-height: 1; margin: 6px 0 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); margin: 0 0 24px; }
fieldset { border: 0; padding: 0; margin: 0 0 30px; }
legend { font: 400 26px/1.1 var(--display); color: var(--blue-deep); padding: 0; margin-bottom: 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.f { display: grid; gap: 5px; }
.f.wide { grid-column: 1 / -1; }
.f label, .f .lbl { font-size: 14px; font-weight: 600; }
.f .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
.f input[type=text], .f input[type=email], .f input[type=tel], .f select, .f textarea { font: inherit; padding: 9px 11px; border: 1px solid #a9abb0; border-radius: 6px; background: var(--surface); color: var(--ink); width: 100%; }
.f textarea { min-height: 96px; resize: vertical; }
.f input:focus, .f select:focus, .f textarea:focus { outline: 3px solid var(--blue); outline-offset: 0; border-color: transparent; }
.choice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--navy); background: var(--wash); }
.choice input { accent-color: var(--navy); width: 18px; height: 18px; }

/* Meals and camping: a quantity per line, the price beside it. */
.qty { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.qty:last-of-type { border-bottom: 1px solid var(--line); }
.qty .price { font-size: 13px; color: var(--muted); }
.stepper { display: inline-grid; grid-template-columns: 34px 44px 34px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stepper button { font: 600 18px var(--text); border: 0; background: var(--wash); color: var(--ink); cursor: pointer; }
.stepper input { width: 100%; border: 0; text-align: center; font: inherit; background: var(--surface); color: var(--ink); -moz-appearance: textfield; }
.qty .sub { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

.summary { position: sticky; top: 16px; align-self: start; margin-top: 64px; border-radius: 10px; background: var(--navy); color: #fff; padding: 20px; }
.summary h2 { font: 400 26px/1 var(--display); margin: 0 0 12px; }
.summary dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; margin: 0 0 14px; font-size: 14px; color: #dfe3f5; }
.summary dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.summary .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid rgba(255,255,255,.25); padding-top: 12px; }
.summary .total b { font: 400 44px/1 var(--display); color: #e9c766; }
.summary button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 6px; background: #fff; color: var(--navy); font: 700 16px var(--text); cursor: pointer; }
.summary p { font-size: 12px; color: #c9cde6; margin: 10px 0 0; }
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .summary { position: sticky; bottom: 0; top: auto; margin: 0 -16px; border-radius: 0; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 12px; }
  .summary h2, .summary dl, .summary p { display: none; }
  .summary .total { border: 0; padding: 0; }
  .summary .total b { font-size: 32px; margin-left: 10px; }
  .summary button { margin: 0; width: auto; padding: 10px 16px; }
  .fields { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="chrome"></div>
<main class="wrap"><form class="layout" id="form" novalidate></form></main>
<script src="maquette.js"></script>
<script>
const FIELDS = __FORM_FIELDS__;
document.getElementById('chrome').innerHTML = siteChrome('Événements');
// The form has no sections in the database: the mockup groups its fields; a « section » per field would let editors do it.
const GROUPS = [['Équipe', ['team_name', 'club_name', 'category', 'registration_fees']], ['Responsable', ['given_name', 'family_name', 'email', 'phone', 'address', 'zip', 'city', 'country']],
  ['Repas et hébergement', null], ['Remarques', ['specific_diet_1702506063517', 'camper_van_plate_numbers_17025046056', 'possible_remarks_1576673342925']]];
const price = f => +(f.label.match(/(\d+(?:\.\d+)?)\s*€/)?.[1] ?? 0);
const clean = l => l.replace(/\s*\(?\d+(?:\.\d+)?\s*€\)?/, '').replace(/\(limited places\)/i, '').trim();
const optional = f => f.required ? '' : ' <span class="opt">facultatif</span>';
const inputType = f => f.type === 'email' ? 'email' : /phone/.test(f.key) ? 'tel' : 'text';

function field(f) {
  const wide = ['textarea', 'radio'].includes(f.type) || /address|team_name/.test(f.key);
  if (f.type === 'radio') return `<div class="f wide" role="radiogroup" aria-labelledby="l-${f.key}"><span class="lbl" id="l-${f.key}">${esc(f.label)}${optional(f)}</span>${f.options.map(o => `<label class="choice"><input type="radio" name="${f.key}" value="${esc(o.value)}"${f.options.length === 1 ? ' checked' : ''} data-fee="${price({ label: o.label_fr })}">${esc(o.label_fr)}</label>`).join('')}</div>`;
  if (f.options?.length) return `<div class="f"><label for="${f.key}">${esc(f.label)}${optional(f)}</label><select id="${f.key}">${f.options.map(o => `<option>${esc(o.label_fr)}</option>`).join('')}</select></div>`;
  if (f.type === 'textarea') return `<div class="f wide"><label for="${f.key}">${esc(f.label)}${optional(f)}</label><textarea id="${f.key}"></textarea></div>`;
  return `<div class="f${wide ? ' wide' : ''}"><label for="${f.key}">${esc(f.label)}${optional(f)}</label><input id="${f.key}" type="${inputType(f)}"${f.required ? ' required' : ''}></div>`;
}
const qty = f => `<div class="qty"><span><label for="${f.key}">${esc(clean(f.label))}</label><br><span class="price">${price(f).toFixed(2).replace('.', ',')} € l'unité</span></span>
  <span class="stepper"><button type="button" data-step="-1" aria-label="Moins">−</button><input id="${f.key}" type="number" min="0" value="0" inputmode="numeric" data-price="${price(f)}"><button type="button" data-step="1" aria-label="Plus">+</button></span><span class="sub" data-sub="${f.key}">0 €</span></div>`;

const byKey = Object.fromEntries(FIELDS.map(f => [f.key, f]));
document.getElementById('form').innerHTML = `<div>
  <nav class="crumbs" aria-label="Fil d'Ariane"><a href="accueil.html">Accueil</a> › <a href="evenements.html">Événements</a></nav>
  <h1>2025 International Tournament of Pas-de-Calais</h1>
  <p class="facts"><span>Inscription des équipes</span><span>Les champs sont obligatoires sauf mention « facultatif ».</span></p>
  ${GROUPS.map(([legend, keys]) => `<fieldset><legend>${legend}</legend>${keys
    ? `<div class="fields">${keys.map(k => byKey[k]).filter(Boolean).map(field).join('')}</div>`
    : FIELDS.filter(f => f.type === 'number').map(qty).join('')}</fieldset>`).join('')}
</div>
<aside class="summary" aria-live="polite"><h2>Récapitulatif</h2><dl id="lines"></dl><div class="total"><span>Total</span><b id="total">0 €</b></div>
  <button type="submit">Envoyer l'inscription</button><p>Vous recevrez une confirmation par e-mail. Le paiement se fait ensuite par le lien indiqué.</p></aside>`;

const euro = n => `${n.toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 2 })} €`;
function total() {
  const fee = +(document.querySelector('[name=registration_fees]:checked')?.dataset.fee ?? 0);
  const lines = [['Inscription', fee]];
  document.querySelectorAll('[data-price]').forEach(i => {
    const n = Math.max(0, +i.value || 0), sub = n * +i.dataset.price;
    document.querySelector(`[data-sub="${i.id}"]`).textContent = euro(sub);
    if (n) lines.push([`${clean(byKey[i.id].label)} × ${n}`, sub]);
  });
  document.getElementById('lines').innerHTML = lines.map(([l, v]) => `<dt>${esc(l)}</dt><dd>${euro(v)}</dd>`).join('');
  document.getElementById('total').textContent = euro(lines.reduce((s, [, v]) => s + v, 0));
}
const form = document.getElementById('form');
form.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (!b) return; const i = b.parentElement.querySelector('input'); i.value = Math.max(0, (+i.value || 0) + +b.dataset.step); total(); });
form.addEventListener('input', total);
form.addEventListener('submit', e => e.preventDefault());
total();
demoBar();
</script>
</body>
</html>
