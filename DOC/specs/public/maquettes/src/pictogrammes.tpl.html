<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pictogrammes des médailles</title>
<link rel="stylesheet" href="maquette.css">
<link rel="stylesheet" href="medals.css">
<style>
main { padding-bottom: 70px; }
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 28px; margin: 18px 0 8px; padding: 0; list-style: none; }
.principles li { border-top: 2px solid var(--navy); padding-top: 8px; font-size: 14px; }
.principles b { display: block; font-size: 15px; }
.families { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 8px; padding: 0; list-style: none; }
.families li { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
.families code { font-size: 11px; color: var(--muted); }
section { margin-top: 36px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; }
.card .disc { grid-row: span 3; }
.card .names b { font-weight: 700; }
.card .names .en { color: var(--muted); font-style: italic; }
.card p { margin: 0; font-size: 13px; color: var(--muted); }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
.card .meta code { color: var(--muted); }
.sizes { display: flex; align-items: end; gap: 10px; color: var(--ink); grid-column: 1 / -1; padding-top: 8px; border-top: 1px dashed var(--line); margin-top: 6px; }
.sizes small { font-size: 11px; color: var(--muted); margin-left: auto; }
.sizes a { font-size: 12px; }
.ctx { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
.ctx > div { border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.ctx h3 { margin: 0 0 10px; font-size: 15px; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 64px; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.row .t { color: var(--muted); font-size: 13px; }
.row .lab { color: var(--fam-match); display: inline-flex; }
@media (max-width: 760px) { .page-head h1 { font-size: 40px; } }
</style>
</head>
<body>
<div id="chrome"></div>
<main class="wrap" id="main"></main>
<script src="maquette.js"></script>
<script src="medals-icons.js"></script>
<script src="medals.js"></script>
<script>
document.getElementById('chrome').innerHTML = siteChrome('');
const TYPES = [['medal', 'Médailles d’équipe et de joueur', e => e.scopes.match(/[TP]/)], ['label', 'Étiquettes de match'], ['medal', 'Médailles d’arbitre', e => e.scopes === 'R'], ['stat', 'Statistiques']];
const surfaces = e => e.surfaces.length ? e.surfaces.map(s => `<span class="surf ${s}">${s}</span>`).join('') : '<span class="surf none">admin</span>';
const card = e => `<div class="card fam-${e.family}">
  <span class="disc lg">${iconSvg(e.code, 28)}</span>
  <span class="names">${doubleName(e)}</span>
  <p>${esc(e.explain(THRESHOLDS))}</p>
  <span class="meta"><code>${e.code}</code><span class="lvl" title="Niveau de données">${e.level}</span>${surfaces(e)}</span>
  <span class="sizes" aria-hidden="true">${iconSvg(e.code, 32)}${iconSvg(e.code, 24)}${iconSvg(e.code, 16)}<small>32 · 24 · 16 px</small>${MEDAL_ICONS[e.code] ? `<a href="pictogrammes/${e.code}.svg">SVG</a>` : ''}</span>
</div>`;
document.getElementById('main').innerHTML = `
  <div class="page-head"><h1>Pictogrammes</h1>
    <p>Un pictogramme dessiné exprès pour chaque médaille, étiquette et statistique (FEATURE_MATCH_MEDALS.md § 7.1). Ils sont servis par api2 en SVG et communs à app2, app3 et l’admin.</p></div>
  <ul class="principles">
    <li><b>Vocabulaire sportif</b>Ballon, but suspendu, kayak, chrono, cartons, sifflet. Rien de guerrier.</li>
    <li><b>Un trait, une couleur</b>Grille de 24, trait de 1,75, une seule couleur (<code>currentColor</code>) : la famille donne la teinte, le thème sombre suit.</li>
    <li><b>Lisible à 16 px</b>Pas plus de trois éléments ; le badge (sifflet, %, barres) découpe le dessin sous lui.</li>
    <li><b>Ni or ni rouge</b>L’or reste aux finales et aux podiums, le rouge au direct. La couleur n’est jamais seule : le nom est toujours écrit.</li>
  </ul>
  <h2 class="section" style="margin-top:26px">Familles</h2>
  <ul class="families">${Object.entries(FAMILIES).map(([k, f]) => `<li class="fam-${k}"><span class="disc">${iconSvg(FAMILY_ICON[k], 18)}</span>${f.fr} · <i>${f.en}</i> <code>--fam-${k}</code></li>`).join('')}</ul>
  <p class="mock-note">Le pictogramme générique de la famille s’affiche tant qu’un nouvel élément n’a pas le sien.</p>
  ${TYPES.map(([type, title, filter]) => `<section><h2 class="section">${title}</h2><div class="grid">${CATALOG.filter(e => e.type === type && (!filter || filter(e))).map(card).join('')}</div></section>`).join('')}
  <section><h2 class="section">En situation</h2><div class="ctx">
    <div><h3>Pastilles (app2, app3)</h3>
      <div class="pills" style="margin-bottom:12px">${pill('opener', { detail: '1re mi-temps · 08:12' })}${pill('powerplay', { count: 2 })}${pill('hat_trick', { detail: '4 buts' })}${pill('comeback')}</div>
      <div class="pills">${pill('opener', { compact: true })}${pill('powerplay', { compact: true, count: 2 })}${pill('golden_goal', { compact: true })}${pill('ref_knockout', { compact: true })}</div>
      <p class="mock-note">Au survol ou au focus clavier : l’explication et, pour un but, son moment. En anglais : « Powerplay » seul.</p></div>
    <div><h3>Liste des matchs d’app3 : match étiqueté</h3>
      <div class="row"><span class="t">14:05</span><span>Corbeil-Essonnes I – Saint-Grégoire I</span><span class="lab">${pill('thriller', { compact: true })}</span><span class="chip">4<span class="sep">-</span><span class="lose">3</span></span></div>
      <div class="row"><span class="t">15:10</span><span>Condé-sur-Vire I – Saint-Nazaire I</span><span></span><span class="chip"><span class="lose">0</span><span class="sep">-</span>3</span></div>
      <p class="mock-note">Seules les étiquettes publiées sur app3 apparaissent, en pictogramme seul, nom et explication dans l’info-bulle.</p></div>
  </div></section>`;
demoBar();
</script>
</body>
</html>
