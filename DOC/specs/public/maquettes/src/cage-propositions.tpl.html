<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cage inviolée · propositions</title>
<link rel="stylesheet" href="maquette.css">
<link rel="stylesheet" href="medals.css">
<style>
main { padding-bottom: 70px; }
.props { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin-top: 24px; }
.props > section { border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.props h2 { margin: 0 0 4px; font-size: 22px; }
.props p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.row figure { margin: 0; text-align: center; font-size: 12px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.big { color: var(--fam-defense); }
</style>
</head>
<body>
<div id="chrome"></div>
<main class="wrap" id="main"></main>
<script src="maquette.js"></script>
<script src="medals-icons.js"></script>
<script src="medals.js"></script>
<script>
document.getElementById('chrome').innerHTML = siteChrome('Compétitions');
const W = '<path d="M2 20.2c2.2-1.5 4.4-1.5 6.6 0s4.4 1.5 6.6 0 4.4-1.5 6.8 0"/>';
const PROPOSALS = {
  actuel: { title: 'Actuel', text: 'Cadre de handball vu de face : lisible, mais rien ne dit « kayak-polo ».' },
  cage_a: { title: 'A · Le but de face, au-dessus de l’eau', text: 'Cadre 2 × 1 m, filet quadrillé, les deux suspentes et la ligne d’eau : le but est suspendu, comme au bord du terrain.',
    svg: '<rect x="2.5" y="4" width="19" height="10.5" rx="1"/><path d="M8.8 4v10.5M15.2 4v10.5M2.5 9.25h19" stroke-width="1.1"/><path d="M6.5 4V1.5M17.5 4V1.5"/>' + W },
  cage_b: { title: 'B · Le but incliné, filet en poche', text: 'Comme sur la photo : le cadre penche en arrière et le filet retombe derrière lui ; plus reconnaissable, un peu moins net à 16 px.',
    svg: '<path d="M4.5 5.2L21 3v10.6L4.5 16z"/><path d="M9.9 4.5v10.7M15.4 3.8v10.4M4.5 10.6L21 8.3" stroke-width="1.1"/><path d="M4.5 16C3 17 2.6 18.2 2.8 19.5" stroke-width="1.1"/>' + W.replace('M2 20.2','M2 21') },
};
MEDAL_ICONS.cage_a = PROPOSALS.cage_a.svg; MEDAL_ICONS.cage_b = PROPOSALS.cage_b.svg;
for (const c of ['cage_a', 'cage_b']) BY_CODE[c] = { ...BY_CODE.clean_sheet, code: c };
document.getElementById('main').innerHTML = `
  <header class="page-head"><h1>Cage inviolée : deux propositions</h1></header>
  <p class="mock-note">Même grille que les autres pictogrammes (24 px, trait de 1,75, une seule couleur). Aux tailles réelles : 16 px (étiquette), 24 px, blason de 40 et 56 px.</p>
  <div class="props">${['actuel', 'cage_a', 'cage_b'].map(k => { const code = k === 'actuel' ? 'clean_sheet' : k, p = PROPOSALS[k]; return `<section class="fam-defense">
    <h2>${p.title}</h2><p>${p.text}</p>
    <div class="row">
      <figure><span class="big">${iconSvg(code, 96)}</span>96 px</figure>
      <figure><span class="big">${iconSvg(code, 24)}</span>24 px</figure>
      <figure><span class="big">${iconSvg(code, 16)}</span>16 px</figure>
      <figure>${shield(code, { size: 56 })}56 px</figure>
      <figure>${shield(code, { size: 40, count: 3 })}40 px</figure>
    </div></section>`; }).join('')}</div>`;
demoBar('<span>Choisir A ou B (ou demander une variante)</span>');
</script>
</body>
</html>
