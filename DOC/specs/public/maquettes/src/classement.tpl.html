<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement PlayOff Hommes</title>
<link rel="stylesheet" href="maquette.css">
<style>
.status-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px; margin: 24px 0 8px; }
.status-row p { margin: 0; font-weight: 600; }
.status-row p span { font-weight: 400; color: var(--muted); }

/* The podium: second, first, third, on steps of their height. */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 12px; max-width: 760px; margin: 18px auto 40px; }
.step { text-align: center; text-decoration: none; }
.step .who { display: grid; justify-items: center; gap: 8px; padding: 0 6px 12px; }
.step img, .step .logo { width: 72px; height: 72px; }
.step b { font-size: 17px; line-height: 1.2; }
.step:hover b { text-decoration: underline; }
.step small { color: var(--muted); font-variant-numeric: tabular-nums; }
.step .block { display: grid; place-items: center; border-radius: 8px 8px 0 0; color: #fff; font: 400 54px/1 var(--display); }
.step.m1 .block { height: 150px; background: var(--navy); }
.step.m1 .block span { color: #e9c766; }
.step.m2 .block { height: 110px; background: color-mix(in srgb, var(--navy) 82%, var(--surface)); }
.step.m3 .block { height: 82px; background: color-mix(in srgb, var(--navy) 66%, var(--surface)); }
.step.m1 img { width: 92px; height: 92px; }
.step.m1 b { font-size: 21px; }

.table-wrap { overflow-x: auto; margin-bottom: 56px; }
.rank tr.medal-row td.rk { color: var(--title); }
.rank .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: 3px; }
.rank .dot.m1 { background: var(--gold); } .rank .dot.m2 { background: var(--silver); } .rank .dot.m3 { background: var(--bronze); }
@media (max-width: 760px) {
  .rank .opt { display: none; }
  .podium { gap: 6px; }
  .step img, .step .logo { width: 48px; height: 48px; }
  .step.m1 img { width: 60px; height: 60px; }
  .step b, .step.m1 b { font-size: 14px; }
  .step .block { font-size: 40px; }
  .step.m1 .block { height: 110px; } .step.m2 .block { height: 80px; } .step.m3 .block { height: 60px; }
}
</style>
</head>
<body>
<div id="chrome"></div>
<div id="head"></div>
<main class="wrap" id="main"></main>
<script src="maquette.js"></script>
<script>
const COMP = __COMP__;
const EVENT = __EVENT__;
const RANKING = __RANKING__;
const LOGOS = logosByTeam(__GAMES__);
document.getElementById('chrome').innerHTML = siteChrome('Compétitions');
document.getElementById('head').innerHTML = competitionHeader(COMP, 'Classement', EVENT.competitions.length);

const rows = RANKING.rows;
const podium = [2, 1, 3].map(m => rows.find(r => r.medal === m)).filter(Boolean);
const signed = n => (n > 0 ? '+' : '') + n;
document.getElementById('main').innerHTML = `
  <div class="status-row"><p>${RANKING.status === 'END' ? 'Classement final' : 'Classement provisoire'}</p><a href="#">Classement en PDF</a></div>
  ${podium.length === 3 ? `<section class="podium" aria-label="Podium">${podium.map(r => `<a class="step m${r.medal}" href="#">
    <span class="who">${logoImg(LOGOS[r.team.number])}<b>${esc(r.team.label)}</b><small>${r.points} pts, ${r.won} victoires</small></span>
    <span class="block" aria-label="${r.rank}e place"><span>${r.rank}</span></span></a>`).join('')}</section>` : ''}
  <div class="table-wrap"><table class="rank">
    <caption class="sr-only">Classement complet</caption>
    <thead><tr><th class="l" scope="col">Rang</th><th class="l" scope="col">Équipe</th><th scope="col" title="Points">Pts</th><th scope="col" title="Matchs joués">J</th>
      <th scope="col" title="Gagnés">G</th><th scope="col" title="Nuls" class="opt">N</th><th scope="col" title="Perdus">P</th><th scope="col" title="Forfaits" class="opt">F</th>
      <th scope="col" title="Buts marqués" class="opt">Buts +</th><th scope="col" title="Buts encaissés" class="opt">Buts −</th><th scope="col" title="Différence de buts">Diff.</th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.medal ? 'medal-row' : ''}"><td class="rk">${r.rank}${r.medal ? `<span class="dot m${r.medal}" aria-label="médaille"></span>` : ''}</td>
      <td class="l"><a class="tm" href="equipe.html">${logoImg(LOGOS[r.team.number])}<span>${esc(r.team.label)}</span></a></td>
      <td class="pts">${r.points}</td><td>${r.played}</td><td>${r.won}</td><td class="opt">${r.drawn}</td><td>${r.lost}</td><td class="opt">${r.forfeits}</td>
      <td class="opt">${r.goals_for}</td><td class="opt">${r.goals_against}</td><td>${signed(r.goal_diff)}</td></tr>`).join('')}</tbody>
  </table></div>`;
demoBar();
</script>
</body>
</html>
