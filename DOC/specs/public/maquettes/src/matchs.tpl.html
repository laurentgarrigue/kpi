<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchs PlayOff Hommes</title>
<link rel="stylesheet" href="maquette.css">
<style>
@font-face { font-family: 'Raleway'; font-weight: 100 900; font-display: swap; src: url('https://beta.kpi.localhost/fonts/raleway/raleway-latin-wght-normal.woff2') format('woff2-variations'); }
@font-face { font-family: 'Agency FB'; font-display: swap; src: url('https://beta.kpi.localhost/fonts/agency-fb/agencyfb.ttf') format('truetype'); }

:root {
  --navy: #20265b;
  --blue: #357b9c;
  --blue-deep: #2a5f78;
  --wash: #eef5f9;
  --ink: #1e1e1c;
  --muted: #5d5f63;
  --line: #dcdddd;
  --surface: #ffffff;
  --gold: #9a7208;
  --live: #c94a4c;
  --spine: var(--navy);
  --spine-ink: #ffffff;
  --display: 'Agency FB', 'Arial Narrow', Arial, sans-serif;
  --text: 'Raleway', ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #7fb6d1; --blue-deep: #9cc8de; --wash: #1b2347; --ink: #eceef2; --muted: #a9adb8;
    --line: #2e3560; --surface: #11163a; --gold: #d9b24a; --live: #e2797a; --spine: #2b3375;
  }
}
:root[data-theme="dark"] {
  --blue: #7fb6d1; --blue-deep: #9cc8de; --wash: #1b2347; --ink: #eceef2; --muted: #a9adb8;
  --line: #2e3560; --surface: #11163a; --gold: #d9b24a; --live: #e2797a; --spine: #2b3375;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 15px/1.5 var(--text); }
a { color: inherit; }
a:focus-visible, button:focus-visible, label:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* ---- header: compact, one idea per line */
.crumbs { font-size: 13px; color: var(--muted); padding: 20px 0 8px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font: 400 52px/1 var(--display); color: var(--navy); margin: 0; letter-spacing: .005em; }
:root[data-theme="dark"] h1 { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1 { color: var(--ink); } }
.season { font: 400 30px/1 var(--display); color: var(--blue); }
.state { font-size: 13px; font-weight: 600; color: var(--muted); }
.live-btn { margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 6px; background: var(--live); color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; }
.live-btn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.event-line { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
.event-line a { color: var(--ink); font-weight: 600; text-decoration-color: var(--blue); text-underline-offset: 3px; }
.siblings { display: flex; gap: 8px; margin: 18px 0 0; }
.siblings a { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; text-decoration: none; }
.siblings a[aria-current] { background: var(--navy); border-color: var(--navy); color: #fff; }

/* ---- tabs + day switcher, sticky together */
.bar { position: sticky; top: 0; z-index: 5; background: var(--surface); margin-top: 20px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs a { flex: none; padding: 12px 14px; font-weight: 600; font-size: 15px; text-decoration: none; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs a[aria-current] { color: var(--ink); border-color: var(--navy); }
:root[data-theme="dark"] .tabs a[aria-current] { border-color: var(--blue); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 0; }
.days { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.days a { padding: 6px 14px; font-size: 14px; text-decoration: none; border-left: 1px solid var(--line); }
.days a:first-child { border-left: 0; }
.days a[aria-current] { background: var(--wash); font-weight: 700; color: var(--navy); }
:root[data-theme="dark"] .days a[aria-current] { color: var(--ink); }
.upcoming { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.upcoming input { width: 16px; height: 16px; accent-color: var(--navy); }
.pdf { margin-left: auto; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }

/* ---- a day */
.day { margin: 28px 0 8px; }
.day-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
.day-head h2 { font: 400 32px/1.1 var(--display); color: var(--blue-deep); margin: 0; }
.day-head span { font-size: 13px; color: var(--muted); }

/* The score spine: one continuous navy column per day. */
.games { list-style: none; margin: 0; padding: 0; }
.game {
  display: grid;
  grid-template-columns: 52px 74px minmax(110px, 150px) 1fr 108px 1fr minmax(160px, 230px) 34px;
  align-items: center;
  min-height: 52px;
  border-bottom: 1px solid var(--line);
}
.game:last-child { border-bottom: 0; }
.time { font-variant-numeric: tabular-nums; font-weight: 600; }
.pitch { font-size: 13px; color: var(--muted); }
.phase { font-size: 13px; color: var(--muted); line-height: 1.3; }
.phase .code { display: block; font-size: 12px; opacity: .8; }
.team { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-width: 0; text-decoration: none; }
.team:hover .name { text-decoration: underline; }
.team.a { justify-content: flex-end; text-align: right; }
.team .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team.win .name { font-weight: 700; }
.team.tbd .name { font-style: italic; color: var(--muted); }
.logo { width: 26px; height: 26px; object-fit: contain; flex: none; }
.score {
  align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--spine); color: var(--spine-ink); text-decoration: none;
  font: 400 30px/1 var(--display); font-variant-numeric: tabular-nums;
}
.game:first-child .score { border-radius: 6px 6px 0 0; }
.game:last-child .score { border-radius: 0 0 6px 6px; }
.score .s { min-width: 1ch; text-align: center; }
.score .s.lose { opacity: .5; }
.score .sep { opacity: .4; font-size: 22px; }
.score:hover .s { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.score.pending { font-size: 18px; opacity: 1; }
.score.pending .s { opacity: .45; }
.score-col { position: relative; align-self: stretch; display: flex; flex-direction: column; }
.score-col .score { flex: 1; }
.flag { font: 600 11px/1 var(--text); letter-spacing: 0; text-align: center; padding: 3px 0; background: var(--spine); color: #fff; }
.flag.live { background: var(--live); }
.flag.live::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; margin-right: 5px; vertical-align: 1px; animation: blink 1.4s infinite; }
.flag.prov { color: #ffd88a; }
.flag .short { display: none; }
.game.is-live .score { background: var(--live); }
.refs { font-size: 13px; color: var(--muted); padding-left: 18px; line-height: 1.35; }
.sheet { justify-self: end; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; color: var(--muted); }
.sheet:hover { background: var(--wash); color: var(--ink); }
.sheet svg { width: 18px; height: 18px; }

/* The final: gold, the only podium cue. */
.game.final .phase { color: var(--gold); font-weight: 700; }
.game.final .phase::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 6px; }

.game.past-now { opacity: 1; }
.now-line { height: 0; border-top: 2px solid var(--live); position: relative; margin: -1px 0; }
.now-line span { position: absolute; left: 0; top: -10px; background: var(--live); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 3px; }

@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .flag.live::before { animation: none; } }

/* ---- phone: teams stacked, scores stacked in the spine on the right */
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  h1 { font-size: 40px; }
  .season { font-size: 24px; }
  .live-btn { margin-left: 0; padding: 6px 12px; font-size: 13px; }
  .event-line { font-size: 14px; }
  .tools { gap: 10px 14px; }
  .pdf { margin-left: 0; }
  .day-head h2 { font-size: 28px; }
  .game {
    grid-template-columns: 60px 1fr 54px;
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "time a    sa"
      "meta b    sb"
      "meta refs refs";
    column-gap: 0;
    padding: 0;
    min-height: 0;
  }
  .time { grid-area: time; padding-top: 10px; align-self: start; }
  .pitch, .phase { grid-area: meta; align-self: start; font-size: 12px; }
  .phase { display: none; }
  .team { padding: 0 10px 0 0; }
  .team.a { grid-area: a; justify-content: flex-start; text-align: left; padding-top: 10px; }
  .team.b { grid-area: b; padding-bottom: 10px; }
  .team.a .logo { order: -1; }
  .flag .long { display: none; }
  .flag .short { display: inline; }
  .logo { width: 22px; height: 22px; }
  .score-col { grid-row: 1 / span 2; grid-column: 3; }
  .score { flex-direction: column; gap: 0; font-size: 26px; padding: 6px 0; }
  .score .sep { display: none; }
  .score .s { line-height: 1.35; }
  .game:first-child .score { border-radius: 6px 6px 0 0; }
  .refs { display: none; }
  .sheet { display: none; }
  .game .m-phase { display: block; }
}
.m-phase { display: none; grid-column: 2; font-size: 12px; color: var(--muted); padding: 0 0 10px; margin-top: -6px; }
.game.final .m-phase { color: var(--gold); font-weight: 700; }

/* demo control, outside the design */
.demo { position: fixed; left: 12px; bottom: 12px; z-index: 20; background: #fff; color: #222; border: 1px dashed #999; padding: 8px 10px; font-size: 12px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
.demo button { font: inherit; }
</style>
</head>
<body>
<div id="chrome"></div>
<div id="head"></div>
<div class="wrap">
  <div class="tools">
    <nav class="days" aria-label="Jour" id="days"></nav>
    <label class="upcoming"><input type="checkbox" id="upcoming"> Matchs à venir seulement</label>
    <a class="pdf" href="#">Liste des matchs en PDF</a>
  </div>

  <main id="list"></main>
</div>


<script src="maquette.js"></script>
<script>
const GAMES = __GAMES__;
const COMP = __COMP__;
const EVENT = __EVENT__;
const sheetIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>';
const IMG = KPI_IMG;
const fmtDay = d => new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(d));
let state = { day: null, upcoming: false, sim: false };

function simulated(g) {
  if (!state.sim) return g;
  const key = g.g_date + g.g_time;
  const now = '2026-07-0413:30';
  if (key === '2026-07-0413:15') return { ...g, g_status: 'ON', g_period: 'M2', g_score_a: '1', g_score_b: '1', g_validation: 'N' };
  if (key === '2026-07-0412:05') return { ...g, g_validation: 'N' };
  if (key > now) return { ...g, g_status: 'ATT', g_score_a: null, g_score_b: null, g_validation: 'N',
    t_a_label: g.g_date > '2026-07-04' ? null : g.t_a_label, t_b_label: g.g_date > '2026-07-04' ? null : g.t_b_label };
  return g;
}

function team(g, side, win) {
  const label = g[`t_${side}_label`];
  if (!label) {
    const slot = (g.g_code || '').replace(/[\[\]]/g, '').split('/')[side === 'a' ? 0 : 1]?.split('-')[0] ?? '';
    return `<span class="team ${side} tbd"><span class="name">${esc(slot ? describeSlot(slot) : 'À définir')}</span></span>`;
  }
  const logo = g[`t_${side}_logo`] ? `<img class="logo" src="${IMG}${g[`t_${side}_logo`]}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="logo"></span>';
  return `<a class="team ${side}${win ? ' win' : ''}" href="#">${side === 'a' ? `<span class="name">${esc(label)}</span>${logo}` : `${logo}<span class="name">${esc(label)}</span>`}</a>`;
}
function describeSlot(s) {
  let m;
  if ((m = s.match(/^([12])([A-F])$/))) return `${m[1] === '1' ? '1er' : '2e'} poule ${m[2]}`;
  if ((m = s.match(/^W(\d+)$/))) return `Vainqueur n° ${m[1]}`;
  if ((m = s.match(/^L(\d+)$/))) return `Perdant n° ${m[1]}`;
  return s;
}

function row(raw) {
  const g = simulated(raw);
  const has = g.g_score_a !== null && g.g_status !== 'ATT';
  const a = +g.g_score_a, b = +g.g_score_b;
  const winA = g.g_status === 'END' && a > b, winB = g.g_status === 'END' && b > a;
  const live = g.g_status === 'ON', prov = g.g_status === 'END' && g.g_validation !== 'O';
  const final = /^finale$/i.test(g.d_phase);
  const scoreInner = has
    ? `<span class="s${winB ? ' lose' : ''}">${g.g_score_a}</span><span class="sep">–</span><span class="s${winA ? ' lose' : ''}">${g.g_score_b}</span>`
    : `<span class="s">–</span><span class="sep"></span><span class="s">–</span>`;
  const a11y = has ? `${g.g_score_a} à ${g.g_score_b}` : 'pas encore joué';
  const flag = live ? '<span class="flag live"><span class="long">2e mi-temps</span><span class="short">2e MT</span></span>' : prov ? '<span class="flag prov"><span class="long">Provisoire</span><span class="short">Prov.</span></span>' : '';
  const code = g.g_status === 'ATT' && g.g_code ? `<span class="code">${esc(g.g_code.replace(/[\[\]]/g, ''))}</span>` : '';
  const refs = [g.r_1_name, g.r_2_name].filter(Boolean).join(', ');
  return `<li class="game${live ? ' is-live' : ''}${final ? ' final' : ''}" data-key="${g.g_date}${g.g_time}">
    <span class="time">${g.g_time}</span>
    <span class="pitch">Terrain ${esc(g.g_pitch)}</span>
    <span class="phase">${esc(g.d_phase)}${code}</span>
    ${team(g, 'a', winA)}
    <span class="score-col">${flag}<a class="score${has ? '' : ' pending'}" href="#" aria-label="Score ${a11y}, feuille de match n° ${g.g_number}">${scoreInner}</a></span>
    ${team(g, 'b', winB)}
    <span class="refs">${refs ? esc(refs) : ''}</span>
    ${g.g_validation === 'O' && g.g_status === 'END' ? `<a class="sheet" href="#" title="Feuille de marque n° ${g.g_number} (PDF)" aria-label="Feuille de marque n° ${g.g_number}, PDF">${sheetIcon}</a>` : '<span></span>'}
    <span class="m-phase">${esc(g.d_phase)}</span>
  </li>`;
}

function render() {
  const dates = [...new Set(GAMES.map(g => g.g_date))];
  document.getElementById('days').innerHTML = [['', 'Tous'], ...dates.map(d => [d, cap(fmtDay(d)).replace(/ \d+ \w+$/, m => m)])]
    .map(([d, l]) => `<a href="#" data-day="${d}" ${(state.day ?? '') === d ? 'aria-current="true"' : ''}>${l.replace(/^(\w+) (\d+) (\w+)$/, (m, w, n) => `${w.slice(0, 3)}. ${n}`)}</a>`).join('');
  document.querySelector('.state').textContent = state.sim ? 'En cours' : 'Terminé';
  let html = '';
  for (const d of dates) {
    if (state.day && state.day !== d) continue;
    let games = GAMES.filter(g => g.g_date === d);
    if (state.upcoming) games = games.filter(g => simulated(g).g_status !== 'END');
    if (!games.length) continue;
    html += `<section class="day" aria-labelledby="d-${d}"><div class="day-head"><h2 id="d-${d}">${cap(fmtDay(d))}</h2><span>${games.length} matchs</span></div><ol class="games">${games.map(row).join('')}</ol></section>`;
  }
  document.getElementById('list').innerHTML = html || '<p>Aucun match à venir. Décochez « Matchs à venir seulement » pour voir les résultats.</p>';
}
document.getElementById('days').addEventListener('click', e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); state.day = a.dataset.day || null; render(); });
document.getElementById('upcoming').addEventListener('change', e => { state.upcoming = e.target.checked; render(); });
document.getElementById('chrome').innerHTML = siteChrome('Compétitions');
document.getElementById('head').innerHTML = competitionHeader(COMP, 'Matchs', EVENT.competitions.length);
const bar = demoBar('<button type="button" id="sim">Simuler samedi 13 h 30</button>');
bar.querySelector('#sim').addEventListener('click', e => { state.sim = !state.sim; e.target.textContent = state.sim ? 'Revenir au tournoi terminé' : 'Simuler samedi 13 h 30'; render(); });
render();
</script>
</body>
</html>
